name: Build and Deploy — Develop

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/rabotka-backend

on:
  pull_request:
    branches:
      - develop
    types:
      - closed
  workflow_dispatch:

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # JOB 1: Run test suite
  # Blocks the build if any test fails — prevents a broken image from ever
  # reaching GHCR or the VPS.
  # ───────────────────────────────────────────────────────────────────────────
  test:
    name: Test Suite
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          # Cache the pnpm store keyed on the lockfile so unchanged deps are
          # restored instead of re-downloaded on every deploy. pnpm must be
          # installed first for setup-node to locate its store path.
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Run tests
        run: pnpm test --no-coverage

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 2: Build Docker image in CI and push to GHCR
  # Only runs when the PR was actually merged (not just closed).
  # Building here (not on VPS) avoids spending VPS compute on builds.
  # Layer caching via GitHub Actions cache cuts subsequent build times
  # from ~3 min to under 60 s for typical code-only changes.
  # ───────────────────────────────────────────────────────────────────────────
  build-and-push:
    name: Build and Push Image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: write

    outputs:
      image-digest: ${{ steps.push.outputs.digest }}
      image-sha-tag: ${{ steps.sha-tag.outputs.value }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # Pin a recent BuildKit so type=gha cache uses the current GitHub
          # Actions Cache backend (the legacy v1/v2 backend was retired in 2025).
          # Without this, an older BuildKit calls the deprecated reserve API and
          # fails on cache export with "failed to reserve cache".
          driver-opts: image=moby/buildkit:v0.19.0

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Extract short SHA tag
        id: sha-tag
        run: echo "value=sha-$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Registry-backed layer cache stored in GHCR (a :buildcache tag), not
          # GitHub's Actions Cache — which returned 400 outages and gave 0% hit,
          # forcing full rebuilds. mode=max caches every intermediate layer, so a
          # code-only change reuses deps/apt/prisma/fastembed layers (~1 min build
          # vs ~5-6 min cold). ignore-error keeps export best-effort.
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max,ignore-error=true

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 3: Deploy pre-built image to VPS
  # Vault secrets are fetched on the runner, written to .env, then scp'd to
  # the VPS. No secrets are passed over SSH env vars.
  # On failure, the VPS rolls back to the previous container state.
  # ───────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to VPS (develop)
    runs-on: ubuntu-latest
    needs: build-and-push
    # Hard cap so a stall can't hang for hours (GitHub default is 6h). The
    # Hard cap so a stall can't hang for hours. Native pull is fast; the SSH
    # stream fallback (docker save | ssh load) for the large image needs
    # headroom — but still fails within the cap.
    timeout-minutes: 40
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Debug connectivity
        run: |
          echo "Host: ${{ secrets.VPS_HOST }}"
          echo "Port: ${{ secrets.VPS_PORT }}"
          nc -zv -w 5 "${{ secrets.VPS_HOST }}" "${{ secrets.VPS_PORT }}" || echo "Port unreachable"

      - name: Set up known hosts
        run: |
          ssh-keyscan -p "${{ secrets.VPS_PORT }}" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      # Runner→GHCR is reliable; this login is only used by the SSH-stream
      # fallback below (runner pulls the image, then streams it to the VPS).
      - name: Log in to GHCR (for fallback)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image on VPS (native, SSH-stream fallback)
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/rabotka-backend:${{ needs.build-and-push.outputs.image-sha-tag }}"
          DEST="${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          SSHOPTS="-i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -p ${{ secrets.VPS_PORT }}"
          # Fast path: native pull on the VPS. A brand-new tag pulls every layer
          # cold, which a short 90s window can't finish — so it used to fail over
          # to the slow SSH stream on the FIRST deploy (and only pass on a rerun
          # once layers were cached). Each killed attempt resumes from the layers
          # already on disk, so we give it a 300s window × 3 (~15 min budget) to
          # complete natively; a true VPS→GHCR blackhole makes zero progress and
          # still falls through to the SSH-stream fallback below.
          if ssh $SSHOPTS "$DEST" "ok=0; for i in 1 2 3; do timeout 300 docker pull '$IMAGE' && { ok=1; break; }; echo \"native pull attempt \$i stalled...\"; sleep 5; done; [ \$ok = 1 ]"; then
            echo "✅ Native pull succeeded"
          else
            # Fallback: the VPS can't pull from GHCR, but the runner can. Pull
            # here, then stream the image to the VPS over the (IPv4) SSH channel,
            # which is unaffected by the registry blackhole.
            echo "⚠️ Native pull stalled — streaming image to VPS over SSH"
            docker pull "$IMAGE"
            docker save "$IMAGE" | gzip -1 | ssh $SSHOPTS "$DEST" "gunzip | docker load"
            echo "✅ Image loaded on VPS via SSH stream"
          fi

      - name: Fetch secrets from Vault and write .env
        run: |
          LOGIN_RESPONSE=$(curl -s --request POST \
            --data "{\"role_id\":\"${{ secrets.VAULT_ROLE_ID }}\",\"secret_id\":\"${{ secrets.VAULT_SECRET_ID }}\"}" \
            "${{ secrets.VAULT_ADDR }}/v1/auth/approle/login")
          TOKEN=$(echo "$LOGIN_RESPONSE" | jq -r '.auth.client_token')

          SECRET_RESPONSE=$(curl -s \
            --header "X-Vault-Token: $TOKEN" \
            "${{ secrets.VAULT_ADDR }}/v1/secret/data/apps/rabotka-backend-develop")
          VAULT_SECRET=$(echo "$SECRET_RESPONSE" | jq -r '.data.data')

          cat > /tmp/deploy.env << EOF
          # --- from Vault ---
          DATABASE_URL=$(echo "$VAULT_SECRET" | jq -r '.DATABASE_URL')
          DIRECT_DATABASE_URL=$(echo "$VAULT_SECRET" | jq -r '.DIRECT_DATABASE_URL')
          REDIS_HOST=$(echo "$VAULT_SECRET" | jq -r '.REDIS_HOST')
          REDIS_PORT=$(echo "$VAULT_SECRET" | jq -r '.REDIS_PORT')
          REDIS_PASSWORD=$(echo "$VAULT_SECRET" | jq -r '.REDIS_PASSWORD')
          JWT_SECRET=$(echo "$VAULT_SECRET" | jq -r '.JWT_SECRET')
          JWT_EXPIRES_IN=$(echo "$VAULT_SECRET" | jq -r '.JWT_EXPIRES_IN')
          CSRF_SECRET=$(echo "$VAULT_SECRET" | jq -r '.CSRF_SECRET')
          ARCJET_KEY=$(echo "$VAULT_SECRET" | jq -r '.ARCJET_KEY')
          SMTP_HOST=$(echo "$VAULT_SECRET" | jq -r '.SMTP_HOST')
          SMTP_PORT=$(echo "$VAULT_SECRET" | jq -r '.SMTP_PORT')
          SMTP_SECURE=$(echo "$VAULT_SECRET" | jq -r '.SMTP_SECURE')
          SMTP_USER=$(echo "$VAULT_SECRET" | jq -r '.SMTP_USER')
          SMTP_PASSWORD=$(echo "$VAULT_SECRET" | jq -r '.SMTP_PASSWORD')
          SMTP_FROM_ADDRESS=$(echo "$VAULT_SECRET" | jq -r '.SMTP_FROM_ADDRESS')
          FRONTEND_URL=$(echo "$VAULT_SECRET" | jq -r '.FRONTEND_URL')
          ADMIN_BASE_URL=$(echo "$VAULT_SECRET" | jq -r '.ADMIN_BASE_URL')
          ALLOW_ORIGINS=$(echo "$VAULT_SECRET" | jq -r '.ALLOW_ORIGINS')
          SUPER_ADMIN_EMAIL=$(echo "$VAULT_SECRET" | jq -r '.SUPER_ADMIN_EMAIL')
          # --- WhatsApp: provider switch and both credential sets ---
          # Every value here comes from Vault, the provider included, so moving
          # an environment between Twilio and the Meta Cloud API is a Vault edit
          # plus a re-run of this workflow — no code change, no image rebuild.
          #
          # The "// empty-string" fallback on every line is load-bearing: a jq
          # lookup of a key Vault does not have prints the literal string null,
          # and TWILIO_AUTH_TOKEN=null passes the schema's non-empty check, so
          # the app would boot clean and fail every send on auth. Empty is the
          # honest value for absent, and the guard step below makes it fatal.
          #
          # NOTE: this heredoc is unquoted, so backticks and dollar-parens in
          # these comments would be EXECUTED and their output written into the
          # .env. Keep the prose free of both.
          #
          # PROVIDER falls back to empty rather than to twilio: the preprocess
          # in whatsapp.config.ts already treats blank as twilio, and repeating
          # the default here is a second source of truth that can drift.
          #
          # WHATSAPP_CLOUD_API_VERSION is deliberately NOT in this heredoc. Its
          # zod default only fires on undefined, not on an empty string, so an
          # empty line here fails the v25.0 regex and the app will not boot. It
          # is appended below only when Vault actually has a value.
          WHATSAPP_PROVIDER=$(echo "$VAULT_SECRET" | jq -r '.WHATSAPP_PROVIDER // ""')
          TWILIO_ACCOUNT_SID=$(echo "$VAULT_SECRET" | jq -r '.TWILIO_ACCOUNT_SID // ""')
          TWILIO_AUTH_TOKEN=$(echo "$VAULT_SECRET" | jq -r '.TWILIO_AUTH_TOKEN // ""')
          TWILIO_WHATSAPP_FROM=$(echo "$VAULT_SECRET" | jq -r '.TWILIO_WHATSAPP_FROM // ""')
          TWILIO_SMS_FROM=$(echo "$VAULT_SECRET" | jq -r '.TWILIO_SMS_FROM // ""')
          WHATSAPP_CLOUD_PHONE_NUMBER_ID=$(echo "$VAULT_SECRET" | jq -r '.WHATSAPP_CLOUD_PHONE_NUMBER_ID // ""')
          WHATSAPP_CLOUD_ACCESS_TOKEN=$(echo "$VAULT_SECRET" | jq -r '.WHATSAPP_CLOUD_ACCESS_TOKEN // ""')
          WHATSAPP_CLOUD_APP_SECRET=$(echo "$VAULT_SECRET" | jq -r '.WHATSAPP_CLOUD_APP_SECRET // ""')
          WHATSAPP_CLOUD_VERIFY_TOKEN=$(echo "$VAULT_SECRET" | jq -r '.WHATSAPP_CLOUD_VERIFY_TOKEN // ""')
          WHATSAPP_CLOUD_WABA_ID=$(echo "$VAULT_SECRET" | jq -r '.WHATSAPP_CLOUD_WABA_ID // ""')
          WHATSAPP_FEEDBACK_FLOW_ID=$(echo "$VAULT_SECRET" | jq -r '.WHATSAPP_FEEDBACK_FLOW_ID // ""')
          # --- static values ---
          BACKEND_IMAGE=ghcr.io/${{ github.repository_owner }}/rabotka-backend:${{ needs.build-and-push.outputs.image-sha-tag }}
          NODE_ENV=production
          AUTH_COOKIE_NAME=access_token
          LOG_LEVEL=info
          HEALTH_DISK_CHECK_ENABLED=true
          HEALTH_DISK_THRESHOLD_PERCENT=0.98
          THROTTLE_TTL=60000
          THROTTLE_LIMIT=100
          RUN_QUEUE_WORKER=false
          RUN_REMINDER_WORKER=true
          WHATSAPP_REMINDERS_LOCK_MS=1800000
          WATERMARK_LOGO_PATH=assets/rabotka-logo.png
          WATERMARK_OPACITY=0.3
          SMTP_MOCK=false
          SMTP_FROM_NAME=Rabotka
          PDF_OWNER_PASSWORD=password
          PORT=$(echo "$VAULT_SECRET" | jq -r '.PORT')
          APP_ENV=develop
          ARCJET_ENV=development
          API_DOMAIN=api-rabotka.${{ secrets.INFRA_DOMAIN }}
          # --- SystemConfig-overridden placeholders ---
          DRIVER=S3
          AWS_REGION=placeholder
          AWS_ACCESS_KEY_ID=placeholder
          AWS_SECRET_ACCESS_KEY=placeholder
          AWS_S3_BUCKET=placeholder
          CLOUDINARY_CLOUD_NAME=placeholder
          CLOUDINARY_API_KEY=placeholder
          CLOUDINARY_API_SECRET=placeholder
          TWILIO_WEBHOOK_BASE_URL=$(echo "$VAULT_SECRET" | jq -r '.TWILIO_WEBHOOK_BASE_URL')
          QDRANT_URL=$(echo "$VAULT_SECRET" | jq -r '.QDRANT_URL')
          QDRANT_API_KEY=$(echo "$VAULT_SECRET" | jq -r '.QDRANT_API_KEY')
          IS_PROD=false
          CLOUDFLARE_PUBLIC_BASE_URL=$(echo "$VAULT_SECRET" | jq -r '.CLOUDFLARE_PUBLIC_BASE_URL // ""')
          PAYMENT_GATEWAY_DRIVER=$(echo "$VAULT_SECRET" | jq -r '.PAYMENT_GATEWAY_DRIVER')
          MONETBIL_SERVICE_KEY=$(echo "$VAULT_SECRET" | jq -r '.MONETBIL_SERVICE_KEY')
          MTN_MOMO_BASE_URL=$(echo "$VAULT_SECRET" | jq -r '.MTN_MOMO_BASE_URL')
          MTN_MOMO_COLLECTION_API_USER=$(echo "$VAULT_SECRET" | jq -r '.MTN_MOMO_COLLECTION_API_USER')
          MTN_MOMO_COLLECTION_API_KEY=$(echo "$VAULT_SECRET" | jq -r '.MTN_MOMO_COLLECTION_API_KEY')
          MTN_MOMO_COLLECTION_PRIMARY_KEY=$(echo "$VAULT_SECRET" | jq -r '.MTN_MOMO_COLLECTION_PRIMARY_KEY')
          MTN_MOMO_ENVIRONMENT=$(echo "$VAULT_SECRET" | jq -r '.MTN_MOMO_ENVIRONMENT')
          MTN_MOMO_CALLBACK_URL=$(echo "$VAULT_SECRET" | jq -r '.MTN_MOMO_CALLBACK_URL')
          EOF
          sed -i 's/^[[:space:]]*//' /tmp/deploy.env

          # Appended rather than written in the heredoc so the key is ABSENT
          # when Vault has no value. zod's .default('v25.0') fires on undefined
          # only — an empty WHATSAPP_CLOUD_API_VERSION= line fails its regex and
          # takes the container down on boot.
          WA_API_VERSION=$(echo "$VAULT_SECRET" | jq -r '.WHATSAPP_CLOUD_API_VERSION // ""')
          if [ -n "$WA_API_VERSION" ]; then
            echo "WHATSAPP_CLOUD_API_VERSION=$WA_API_VERSION" >> /tmp/deploy.env
          fi

          curl -sf --request POST \
            --header "X-Vault-Token: $TOKEN" \
            "${{ secrets.VAULT_ADDR }}/v1/auth/token/revoke-self" > /dev/null || true

      # Mirrors the discriminated union in whatsapp.config.ts so CI rejects
      # exactly what the container would — but on the runner, before the VPS is
      # touched at all.
      #
      # Worth its own step because a bad .env currently leaves the environment
      # broken with NO rollback: rollback() only fires when `docker compose up
      # -d` itself fails, and that returns success as soon as containers start.
      # A crash-loop or a silently-misconfigured client sails past it and only
      # surfaces in smoke-test, a separate job with no rollback path.
      - name: Verify required WhatsApp secrets are present
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          get() { grep -E "^$1=" /tmp/deploy.env | head -1 | cut -d= -f2-; }

          PROVIDER=$(get WHATSAPP_PROVIDER)
          # Blank inherits the schema's own default rather than assuming here.
          [ -n "$PROVIDER" ] || PROVIDER=twilio

          case "$PROVIDER" in
            twilio) REQUIRED="TWILIO_ACCOUNT_SID TWILIO_AUTH_TOKEN TWILIO_WHATSAPP_FROM" ;;
            cloud)  REQUIRED="WHATSAPP_CLOUD_PHONE_NUMBER_ID WHATSAPP_CLOUD_ACCESS_TOKEN WHATSAPP_CLOUD_APP_SECRET WHATSAPP_CLOUD_VERIFY_TOKEN WHATSAPP_CLOUD_WABA_ID" ;;
            *)
              echo "::error::WHATSAPP_PROVIDER must be 'twilio' or 'cloud', got '$PROVIDER'"
              exit 1
              ;;
          esac

          echo "Provider: $PROVIDER"
          MISSING=""
          for key in $REQUIRED; do
            value=$(get "$key")
            # "null" is what jq writes for a key absent from Vault, and it is
            # non-empty, so the app would accept it and fail at send time.
            if [ -z "$value" ] || [ "$value" = "null" ]; then
              MISSING="$MISSING $key"
            fi
          done

          # Report every missing key at once: fixing them one deploy at a time
          # is three failed runs instead of one.
          if [ -n "$MISSING" ]; then
            echo "::error::Missing from Vault (secret/data/apps/rabotka-backend-develop) for provider '$PROVIDER':$MISSING"
            exit 1
          fi
          echo "All required WhatsApp secrets present."

      - name: Copy .env to VPS
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ServerAliveInterval=60 -o ServerAliveCountMax=10 \
            -P "${{ secrets.VPS_PORT }}" \
            /tmp/deploy.env "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:~/rabotka-backend/.env"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=60 \
            -o ServerAliveCountMax=10 \
            -p "${{ secrets.VPS_PORT }}" "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "chmod 600 ~/rabotka-backend/.env"

      - name: Deploy on VPS (with rollback on failure)
        run: |
          SSH_CMD="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=60 \
            -o ServerAliveCountMax=10 \
            -p ${{ secrets.VPS_PORT }} ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          NEW_IMAGE="ghcr.io/${{ github.repository_owner }}/rabotka-backend:${{ needs.build-and-push.outputs.image-sha-tag }}"

          $SSH_CMD "
            set -e
            cd ~/rabotka-backend

            # Save the image tag currently in use so we can restore it on failure
            PREVIOUS_IMAGE=\$(docker inspect --format='{{.Config.Image}}' \$(docker compose -f docker-compose.prod.yml ps -q api 2>/dev/null) 2>/dev/null | head -1 || echo '')
            echo \"Previous image: \$PREVIOUS_IMAGE\"

            rollback() {
              echo 'Rolling back to previous image...'
              if [ -n \"\$PREVIOUS_IMAGE\" ]; then
                sed -i \"s|BACKEND_IMAGE=.*|BACKEND_IMAGE=\$PREVIOUS_IMAGE|\" .env
                docker compose -f docker-compose.prod.yml up -d --remove-orphans
              fi
              exit 1
            }

            git fetch origin develop
            git reset --hard origin/develop

            # Swap BACKEND_IMAGE to the immutable SHA tag for this deploy
            sed -i \"s|BACKEND_IMAGE=.*|BACKEND_IMAGE=$NEW_IMAGE|\" .env

            timeout 600 docker compose -f docker-compose.prod.yml up -d --remove-orphans || rollback
            # Reclaim disk: drop old sha-tagged images so /var/lib/docker
            # doesn't fill the root FS over many deploys (running image kept).
            docker image prune -af || true
          "

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 4: Smoke tests
  # ───────────────────────────────────────────────────────────────────────────
  smoke-test:
    name: Smoke Test (develop)
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      contents: read

    steps:
      - name: Check health endpoint
        run: |
          # Short initial wait, then poll tightly so a healthy backend is
          # detected in ~15-25s while still tolerating a slow boot (migrations +
          # DB/Redis/Qdrant): 15s + 30×8s ≈ 4 min ceiling. Exits on first 200.
          sleep 15
          for i in $(seq 1 30); do
            STATUS=$(curl -o /tmp/health_response.txt -s -w "%{http_code}" \
              --max-time 30 \
              "https://api-rabotka.${{ secrets.INFRA_DOMAIN }}/api/v1/health")
            echo "Attempt $i — HTTP status: $STATUS"
            cat /tmp/health_response.txt
            [ "$STATUS" = "200" ] && exit 0
            sleep 8
          done
          echo "Health check failed after 30 attempts"
          exit 1

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 5: Slack notification — always runs, reports success or failure
  # ───────────────────────────────────────────────────────────────────────────
  notify:
    name: Slack Notification (develop)
    runs-on: ubuntu-latest
    needs: [test, build-and-push, deploy, smoke-test]
    if: always()
    permissions:
      contents: read

    steps:
      - name: Slack notify success
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        env:
          MESSAGE: |
            Deployment Succeeded (develop)
            ${{ github.event.pull_request.title }}
            Branch: ${{ github.ref_name }}
            Author: ${{ github.actor }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "attachments": [
                {
                  "color": "#00B32C",
                  "text": ${{ toJSON(env.MESSAGE) }}
                }
              ]
            }

      - name: Slack notify failure
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        env:
          MESSAGE: |
            Deployment Failed (develop)
            ${{ github.event.pull_request.title }}
            Branch: ${{ github.ref_name }}
            Author: ${{ github.actor }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "attachments": [
                {
                  "color": "#B3000C",
                  "text": ${{ toJSON(env.MESSAGE) }}
                }
              ]
            }
