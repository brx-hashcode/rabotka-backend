services:
  postgres:
    image: postgres:17-alpine
    container_name: rabotka_postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rabotka
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/:/docker-entrypoint-initdb.d/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rabotka"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rabotka_network

  pgadmin:
    image: dpage/pgadmin4:9.11
    container_name: rabotka_pgadmin
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@rabotka.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - rabotka_network

  mailhog:
    image: mailhog/mailhog:latest
    container_name: rabotka_mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - rabotka_network

  redis:
    image: redis:7-alpine
    container_name: rabotka_redis
    ports:
      - "6379:6379"
    networks:
      - rabotka_network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: rabotka_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - rabotka_network

  localstack:
    image: localstack/localstack:latest
    container_name: rabotka_localstack
    ports:
      - "4566:4566"
      - "4510-4559:4510-4559"
    environment:
      - SERVICES=s3,sqs,sns,lambda,dynamodb,ses,cloudwatch,logs,events,iam,sts,secretsmanager,ssm
      - DEBUG=1
      - DATA_DIR=/var/lib/localstack
      - PERSISTENCE=1
      - LAMBDA_EXECUTOR=docker
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - localstack_data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rabotka_network

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: rabotka_api
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      mailhog:
        condition: service_started
      redis:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:${PORT:-3000}/api/v1/health || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - rabotka_network

  queue-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: rabotka_queue_worker
    command: node dist/src/worker.js
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - DB_DATABASE=rabotka
      - AWS_ENDPOINT_URL=http://localstack:4566
      - SMTP_HOST=mailhog
      - SMTP_PORT=1025
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RUN_QUEUE_WORKER=true
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      mailhog:
        condition: service_started
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - rabotka_network

volumes:
  postgres_data:
  pgadmin_data:
  localstack_data:
  qdrant_data:

networks:
  rabotka_network:
    driver: bridge
