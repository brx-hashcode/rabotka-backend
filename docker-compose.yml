services:
  postgres:
    image: postgres:17-alpine
    container_name: rabotka_postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rabotka
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rabotka"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rabotka_network

  pgadmin:
    image: dpage/pgadmin4:9.11
    container_name: rabotka_pgadmin
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@rabotka.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - rabotka_network

  redis:
    image: redis:7-alpine
    container_name: rabotka_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - rabotka_network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: rabotka_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - rabotka_network

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: rabotka_api
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    volumes:
      - ./scripts/docker-entrypoint.sh:/usr/local/bin/docker-entrypoint.sh
      - ./prisma.config.ts:/app/prisma.config.ts
      - ./prisma:/app/prisma
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - ARCJET_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/rabotka
      - REDIS_HOST=redis
      - QDRANT_URL=http://qdrant:6333
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://localhost:${PORT:-3000}/api/v1/health || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - rabotka_network

  queue-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: rabotka_queue_worker
    command: node dist/src/worker.js
    volumes:
      - ./scripts/docker-entrypoint.sh:/usr/local/bin/docker-entrypoint.sh
      - ./prisma.config.ts:/app/prisma.config.ts
      - ./prisma:/app/prisma
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/rabotka
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QDRANT_URL=http://qdrant:6333
      - RUN_QUEUE_WORKER=true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - rabotka_network

volumes:
  postgres_data:
  pgadmin_data:
  qdrant_data:

networks:
  rabotka_network:
    driver: bridge
